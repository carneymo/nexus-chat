services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    environment:
      INVITE_CODE: ${INVITE_CODE:?Set INVITE_CODE in .env}
      SERVER_NAME: ${SERVER_NAME:-Nexus}
      TURN_URLS: ${TURN_URLS:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TURN_SECRET: ${TURN_SECRET:-}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - chat-data:/data
      - chat-backups:/app/backups
    networks: [gateway]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [gateway]
    depends_on:
      gateway:
        condition: service_healthy
networks:
  gateway:
volumes:
  chat-data:
  chat-backups:
  caddy-data:
  caddy-config:
